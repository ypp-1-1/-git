<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文字实验室 · mini</title>
<style>
  :root {
    --brand: #0071e3;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --soft: #6e6e73;
    --line: #d2d2d7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
    background: linear-gradient(160deg, #f5f5f7 0%, #e8e8ed 100%);
    color: var(--text);
    font: 17px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 640px;
    padding: 32px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
  }
  h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: -0.03em; }
  .sub { margin: 0 0 24px; color: var(--soft); font-size: 15px; }
  textarea {
    width: 100%;
    min-height: 160px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fbfbfd;
    color: var(--text);
    font: inherit;
    resize: vertical;
    outline: none;
  }
  textarea:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.14);
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 14px;
  }
  .count { color: var(--soft); font-size: 13px; }
  button {
    padding: 9px 20px;
    border: none;
    border-radius: 999px;
    background: var(--brand);
    color: #fff;
    font: inherit;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.86; }
  .result {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 20px;
  }
  .badge {
    padding: 16px;
    border-radius: 14px;
    background: #fbfbfd;
    text-align: center;
  }
  .badge span { display: block; margin-bottom: 6px; color: var(--soft); font-size: 12px; }
  .badge strong { font-size: 26px; font-weight: 600; }
  .empty { margin-top: 20px; color: var(--soft); font-size: 14px; }
</style>
</head>
<body>
  <main class="card">
    <h1>文字实验室</h1>
    <p class="sub">贴一段中文，看看它的情绪倾向</p>

    <textarea id="input" placeholder="例如：今天的风很轻，适合把脑海里的想法慢慢写下来。">今天的风很轻，适合把脑海里的想法慢慢写下来。</textarea>

    <div class="row">
      <span class="count">已输入 <b id="count">0</b> 字</span>
      <button id="go" type="button">开始分析</button>
    </div>

    <p class="empty" id="hint">点一下“开始分析”，结果会出现在这里</p>

    <div class="result" id="result" hidden>
      <div class="badge"><span>情感分数</span><strong id="score">0</strong></div>
      <div class="badge"><span>情感判断</span><strong id="label">—</strong></div>
    </div>
  </main>

<script>
  const POSITIVE = ["喜欢", "开心", "快乐", "值得", "美好", "适合", "温暖", "希望", "爱", "成功", "认真", "轻松"];
  const NEGATIVE = ["难过", "痛苦", "失败", "糟糕", "讨厌", "悲伤", "焦虑", "绝望", "累", "烦", "失去", "害怕"];

  const input = document.getElementById("input");
  const count = document.getElementById("count");
  const hint = document.getElementById("hint");
  const result = document.getElementById("result");
  const scoreEl = document.getElementById("score");
  const labelEl = document.getElementById("label");

  function renderCount() {
    count.textContent = input.value.trim().length;
  }

  function analyze() {
    const text = input.value.trim();
    if (!text) {
      hint.textContent = "请先写点什么再分析";
      result.hidden = true;
      return;
    }

    let score = 0.5;
    POSITIVE.forEach((w) => { if (text.includes(w)) score += 0.06; });
    NEGATIVE.forEach((w) => { if (text.includes(w)) score -= 0.06; });
    score = Math.min(0.99, Math.max(0.05, Math.round(score * 100) / 100));

    const label = score >= 0.6 ? "偏积极" : score <= 0.4 ? "偏消极" : "中性";

    scoreEl.textContent = score.toFixed(2);
    labelEl.textContent = label;
    hint.hidden = true;
    result.hidden = false;
  }

  input.addEventListener("input", renderCount);
  document.getElementById("go").addEventListener("click", analyze);
  renderCount();
</script>
</body>
</html>
